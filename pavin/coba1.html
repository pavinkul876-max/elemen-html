<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    h1 {
    color: blueviolet;
    text-align: center;
    font-variant-east-asian: normal;
    }
        /* Selector Elemen - semua tag <h2> */
    h2 {
    color: #3c0a8d;
    border-bottom: 2px solid #07dae9;
    }

    /* Selector Class - elemen yang punya class='highlight' */
    .highlight {
    background-color: yellow;
    font-weight: bold;
    }

    /* Selector ID - elemen dengan id='hero' */
    #hah {
    background-color: #761a22;
    color: rgb(128, 15, 194);
    padding: 20px;
    }

    /* Grouping - terapkan gaya yang sama ke h1, h2, h3 */
    h2, h3 {
    font-family: 'Georgia', serif;
    color: #1A5276;
    }

    /* Pseudo-class - tautan saat di-hover */
    a:hover {
    color: red;
    text-decoration: underline;
    }
    </style>
</head>
<body>
    <h1>Selamat Datang</h1>
    <h2>Rekayasa Perangkat Lunak</h2>
    <p id="hah">anjaahyaahshfbfhf</p>
    <a href="#">X Rpl 2</a>
</body>
</html>
